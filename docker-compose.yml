services:
  cloud-logs:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hyperloop-cloud-logs:latest
    container_name: cloud_logs_api
    user: "1002:1002"
    networks:
      - default
      - caddy_net
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${CLOUD_LOGS_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=sqlite+aiosqlite:////app/data/cloud_logs.db
      - GDRIVE_ROOT_FOLDER_ID=${GDRIVE_ROOT_FOLDER_ID:-}
      - GDRIVE_SERVICE_ACCOUNT_PATH=/app/credentials/service_account.json
      - GDRIVE_SERVICE_ACCOUNT_JSON=${GDRIVE_SERVICE_ACCOUNT_JSON:-}
      - GDRIVE_SIMULATION_MODE=${GDRIVE_SIMULATION_MODE:-false}
      - MASTER_API_KEY=${MASTER_API_KEY:-}
      - MASTER_API_KEY_HASH=${MASTER_API_KEY_HASH:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-90}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-${_GITHUB_CLIENT_ID:-}}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-${_GITHUB_CLIENT_SECRET:-}}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8000/api/v1/auth/github/callback}
      - GITHUB_ORG_NAME=${GITHUB_ORG_NAME:-${GITHUB_ORG_WHITELIST:-Hyperloop-UPV}}
      - ALLOW_PUBLIC_GITHUB_LOGIN=${ALLOW_PUBLIC_GITHUB_LOGIN:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - CLEANUP_ENABLED=${CLEANUP_ENABLED:-true}
      - CLEANUP_RETENTION_DAYS=${CLEANUP_RETENTION_DAYS:-30}
      - CLEANUP_INTERVAL_HOURS=${CLEANUP_INTERVAL_HOURS:-168}
    volumes:
      # Persistent SQLite database directory on VPS host
      - ./backend/data:/app/data
      # Google Drive service account credentials file
      - ./backend/credentials:/app/credentials:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  caddy_net:
    external: true
