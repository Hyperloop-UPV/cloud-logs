[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "TRY002"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query",
    "fastapi.Path",
    "fastapi.params.Path",
    "fastapi.Body",
    "fastapi.params.Body",
    "app.dependencies.require_permission",
    "app.dependencies.require_role",
]
